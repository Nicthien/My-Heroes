# My Heroes — APP stack for Unraid, deployed via PORTAINER → Stacks.
#
# This file defines ONLY the Next.js app. Supabase (Postgres + Auth + Realtime +
# Kong + Studio) is its OWN Portainer stack — see docs/UNRAID.md for the full
# GUI walkthrough. The two stacks talk over a SHARED docker network so the app
# can reach Kong by name; nothing else is published.
#
# How to use in Portainer:
#   1. Deploy the Supabase stack first (docs/UNRAID.md, steps 1–3).
#   2. Portainer → Stacks → Add stack → "my-heroes-app" → paste this file in the
#      web editor, fill the env vars below in the "Environment variables" panel
#      (or paste env.unraid.example), then Deploy.
#
# The app image is PULLED from a registry (built + pushed from your dev machine —
# Unraid has no source checkout). The image is GENERIC: nothing is baked at
# build. ALL config is passed at RUNTIME via the env vars below and read by
# src/lib/config/supabaseEnv.ts; the public subset (URL + anon key) is injected
# to the browser at runtime (RuntimeConfigScript). One image fits any deployment.
#
# Network strategy: PROXY. A PRIVATE/LAN SUPABASE_URL makes the browser route
# Supabase calls through the app's /api/supabase proxy
# (src/lib/supabase/browser.ts). The proxy forwards server-side to Kong over the
# shared docker network via SUPABASE_INTERNAL_URL. Because of this, Supabase does
# NOT need to publish ANY host port for the game to work — that is what removes
# the br0 (192.168.x.x) port-collision risk entirely. Publish Kong only if you
# want the Studio dashboard. See docs/UNRAID.md → "Networking".

services:
  app:
    image: ${REGISTRY_IMAGE:-docker.io/nicthien/my-heroes:latest}
    container_name: my-heroes-app
    restart: unless-stopped
    # Only the app is published. Front it with Zoraxy. Change APP_PORT in the
    # Portainer env panel if 3000 is already taken on the Unraid host.
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # All config is RUNTIME (the image is generic — nothing baked at build).
      # Browser-facing Supabase URL; a private/LAN value flips the client onto
      # the /api/supabase proxy (src/lib/supabase/browser.ts).
      SUPABASE_URL: ${SUPABASE_URL}
      # Anon / publishable key (public by design). Injected to the browser at runtime.
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # Server-only secret.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Where the /api/supabase proxy forwards server-side: Kong on the shared
      # docker network. This is what makes the PROXY strategy work.
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://kong:8000}
    networks:
      - supabase
    # No depends_on: Kong lives in a SEPARATE Portainer stack, so it can't be
    # referenced here. Deploy the Supabase stack first; restart policy handles
    # the rest.

networks:
  supabase:
    external: true
    # The network created by the Supabase stack. Portainer names it
    # "<stackname>_default" — if you named that stack "supabase", this is
    # "supabase_default". Confirm in Portainer → Networks and override via the
    # SUPABASE_NETWORK env var if your stack has a different name.
    name: ${SUPABASE_NETWORK:-supabase_default}
