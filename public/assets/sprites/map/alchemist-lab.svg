<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Shadow -->
  <ellipse cx="32" cy="59" rx="22" ry="4" fill="#00000040"/>
  <!-- Ground -->
  <ellipse cx="32" cy="56" rx="24" ry="6" fill="#3a2a50" stroke="#2a1a40" stroke-width="1"/>
  <!-- Tower base (wider) -->
  <rect x="18" y="38" width="28" height="18" rx="2" fill="#4a2a6a" stroke="#2a1050" stroke-width="1.2"/>
  <!-- Tower mid section -->
  <rect x="22" y="22" width="20" height="18" rx="2" fill="#5a3a7a" stroke="#2a1050" stroke-width="1"/>
  <!-- Tower top / turret -->
  <rect x="24" y="14" width="16" height="10" rx="2" fill="#6a4a8a" stroke="#2a1050" stroke-width="1"/>
  <!-- Pointed spire -->
  <polygon points="32,4 24,14 40,14" fill="#3a1a5a" stroke="#2a1050" stroke-width="1"/>
  <!-- Door -->
  <path d="M27,56 L27,46 Q32,42 37,46 L37,56 Z" fill="#1a0830"/>
  <!-- Tower windows (glowing) -->
  <rect x="27" y="25" width="10" height="7" rx="1" fill="#c080ff" opacity="0.5" stroke="#9050e0" stroke-width="0.5"/>
  <ellipse cx="32" cy="28" rx="4" ry="3" fill="#e0a0ff" opacity="0.4"/>
  <!-- ALCHEMIST RETORT / FLASK (main icon - big) -->
  <path d="M40,42 L46,52 Q50,58 44,58 Q38,58 38,52 L44,42 Z" fill="#d0d0ff" fill-opacity="0.2" stroke="#9090e0" stroke-width="1.5"/>
  <!-- Flask neck -->
  <rect x="42" y="34" width="4" height="9" rx="2" fill="#b0b0d8" stroke="#8080c0" stroke-width="1"/>
  <!-- Flask bulb -->
  <circle cx="44" cy="52" r="8" fill="#c0c0e8" fill-opacity="0.25" stroke="#8080c0" stroke-width="1.5"/>
  <!-- Mercury liquid inside flask (silver) -->
  <ellipse cx="44" cy="55" rx="5.5" ry="3" fill="#c0c8d8" opacity="0.9"/>
  <ellipse cx="44" cy="55" rx="3" ry="1.5" fill="#e8eeff" opacity="0.8"/>
  <!-- Bubble rising in flask -->
  <circle cx="44" cy="50" r="1.5" fill="none" stroke="#a0a8c8" stroke-width="0.8"/>
  <circle cx="46" cy="46" r="1" fill="none" stroke="#a0a8c8" stroke-width="0.6"/>
  <!-- Purple smoke wisps from spire -->
  <path d="M32,4 Q28,0 30,-2" fill="none" stroke="#c080ff" stroke-width="1.5" opacity="0.6"/>
  <path d="M32,4 Q36,-1 34,-3" fill="none" stroke="#c080ff" stroke-width="1.2" opacity="0.5"/>
  <!-- Magical glow orbs -->
  <circle cx="20" cy="44" r="2.5" fill="#b060ff" opacity="0.6"/>
  <circle cx="18" cy="42" r="1.2" fill="#e0a0ff" opacity="0.5"/>
  <circle cx="14" cy="36" r="2" fill="#9040e0" opacity="0.4"/>
</svg>
