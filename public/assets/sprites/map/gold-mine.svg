  <ellipse cx="32" cy="50" rx="8" ry="4" fill="#ffd700" opacity="0.6"/>
  <ellipse cx="32" cy="50" rx="5" ry="2.5" fill="#fff8a0" opacity="0.8"/>
  <!-- Gold nuggets scattered -->
  <circle cx="13" cy="49" r="3.5" fill="#ffd700" stroke="#c8900a" stroke-width="1"/>
  <circle cx="11" cy="47" r="1.5" fill="#ffe880"/>
  <circle cx="51" cy="48" r="3" fill="#ffc800" stroke="#c8900a" stroke-width="1"/>
  <circle cx="32" cy="18" r="2.5" fill="#ffd700" stroke="#c8900a" stroke-width="0.8"/>
  <!-- Pickaxe icon -->
  <line x1="46" y1="28" x2="55" y2="19" stroke="#5a4a38" stroke-width="2.2"/>
  <polygon points="55,19 60,12 63,17 58,22" fill="#b0a090" stroke="#5a4a38" stroke-width="1"/>
  <polygon points="55,19 50,14 55,9 60,12" fill="#d0c0b0" stroke="#5a4a38" stroke-width="1"/>
