  <polygon points="16,44 26,26 30,44" fill="#8a7a60" stroke="none" opacity="0.5"/>
  <polygon points="38,28 48,42 42,42" fill="#6a5a42" stroke="none" opacity="0.5"/>
  <!-- Mine entrance dark tunnel -->
  <path d="M21,54 L21,42 Q32,28 43,42 L43,54 Z" fill="#120e06"/>
