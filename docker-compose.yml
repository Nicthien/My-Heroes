# Docker Compose for the My Heroes app container (local build & run).
#
# Builds and runs the Next.js app only. Supabase (Postgres + Auth + Realtime) is
# a separate stack you provide — see RELEASE.md and docs/UNRAID.md.
#
# The image is GENERIC: nothing is baked at build. All config is passed at
# RUNTIME via the env below, from a local .env (copy .env.example to .env).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-heroes:latest
    container_name: my-heroes-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Defaults to SUPABASE_URL in code when empty (see src/lib/config/supabaseEnv.ts).
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
    # Lets the container reach a Supabase stack running on the host machine
    # (e.g. `supabase start`) via http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
