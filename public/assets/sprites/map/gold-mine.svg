  <polygon points="8,52 32,14 56,52" fill="#7a6a52" stroke="#5a4a38" stroke-width="1.2"/>
  <polygon points="8,52 32,14 20,52" fill="#9a8a6a" stroke="none"/>
  <ellipse cx="32" cy="52" rx="24" ry="6" fill="#7a6a52" stroke="#5a4a38" stroke-width="1"/>
