  <rect x="19" y="40" width="26" height="3" rx="1.5" fill="#7a5220" stroke="#4a3010" stroke-width="0.8"/>
  <rect x="19" y="40" width="3" height="14" rx="1.5" fill="#7a5220" stroke="#4a3010" stroke-width="0.8"/>
  <rect x="42" y="40" width="3" height="14" rx="1.5" fill="#7a5220" stroke="#4a3010" stroke-width="0.8"/>
