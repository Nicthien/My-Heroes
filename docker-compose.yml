# Docker Compose for the My Heroes app container (local build & run).
#
# Builds and runs the Next.js app only. Supabase (Postgres + Auth + Realtime) is
# a separate stack you provide — see RELEASE.md and docs/UNRAID.md.
#
# The image is GENERIC: nothing is baked at build. All config is passed at
# RUNTIME via the env below, from a local .env (copy .env.example to .env).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-heroes:latest
    container_name: my-heroes-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Defaults to SUPABASE_URL in code when empty (see src/lib/config/supabaseEnv.ts).
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
      # Public Cloudflare Turnstile site key for anonymous sign-in.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      # --- Email / SMTP (signup confirmation + welcome mail) -----------------
      # Master switch. Leave "false" on test servers: signup is instant, no email
      # confirmation required and no mail is sent. Set "true" to require it.
      USE_SMTP: ${USE_SMTP:-false}
      # Public URL the app is reached at, used for email links and social previews.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      # "true" for implicit TLS (port 465); "false" for STARTTLS (587/25).
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # From header, e.g. "My Heroes <no-reply@example.com>".
      SMTP_FROM: ${SMTP_FROM:-}
    # Lets the container reach a Supabase stack running on the host machine
    # (e.g. `supabase start`) via http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
